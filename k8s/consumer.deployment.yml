apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-deployment
  labels:
    app: consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
      - name: consumer-container
        image: consumer-service
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3003
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3003
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
        ports:
        - containerPort: 3003
          name: cons-http
        env:
        - name: PORT
          value: "3003"
        - name: NODE_ENV
          value: "production"
        - name: PHARMA_CORE_URL
          value: "http://pharma-core-service:80"
        - name: SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: auth-secret
              key: SERVICE_TOKEN
