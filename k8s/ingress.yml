apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pharma-ingress
  labels:
    app.kubernetes.io/name: pharma-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # ── Manufacturer Service Route ──────────────────────────────────────────
      - pathType: Prefix
        path: "/api/manufacturer"
        backend:
          service:
            name: manufacturer-service
            port:
              number: 80

      # ── Shopkeeper Service Route ────────────────────────────────────────────
      - pathType: Prefix
        path: "/api/shopkeeper"
        backend:
          service:
            name: shopkeeper-service
            port:
              number: 80

      # ── Consumer Service Route ──────────────────────────────────────────────
      - pathType: Prefix
        path: "/api/consumer"
        backend:
          service:
            name: consumer-service
            port:
              number: 80

      # ── Public JWKS Discovery Route (for external standalone blockchain backend) ─
      - pathType: Prefix
        path: "/.well-known"
        backend:
          service:
            name: pharma-core-service
            port:
              number: 80

